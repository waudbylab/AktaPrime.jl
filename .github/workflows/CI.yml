name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # GLMakie needs OpenGL/X libraries even to precompile and load; run
      # everything under a virtual framebuffer.
      - name: Install system OpenGL/X libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xorg-dev mesa-utils libgl1 freeglut3-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev
      - name: Instantiate, precompile and load AktaPrime
        # NB: `import` (not `using`) — `using AktaPrime` would bring the
        # `@main`-annotated `main` into `Main`, which Julia 1.12 auto-runs when
        # the script ends, launching the app into an endless demo loop.
        run: |
          xvfb-run -a julia --project=. -e '
            using Pkg
            Pkg.instantiate()
            Pkg.precompile()
            import AktaPrime
            @assert isdefined(AktaPrime, :main)
            println("AktaPrime loaded OK")
          '
      - name: Run tests
        run: xvfb-run -a julia --project=. -e 'using Pkg; Pkg.test()'
